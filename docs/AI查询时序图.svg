<svg viewBox="0 0 680 740" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<title>一次 AI 查询的完整时序图</title>
<desc>从前端提问到 SSE 返回：工具调用循环、SQL 分类鉴权、执行与流式总结，以及写操作的确认分支。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="28" font-size="15" font-weight="500" fill="#0C447C">一次 AI 查询的完整时序</text>
<text x="40" y="47" font-size="12" fill="#5F5E5A">POST /api/agent/chat（SSE）· 工具调用循环 → 分类鉴权 → 执行 → 流式总结</text>

<line x1="100" y1="98" x2="100" y2="708" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4"/>
<line x1="220" y1="98" x2="220" y2="708" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4"/>
<line x1="340" y1="98" x2="340" y2="708" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4"/>
<line x1="460" y1="98" x2="460" y2="708" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4"/>
<line x1="580" y1="98" x2="580" y2="708" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4"/>

<rect x="48" y="64" width="104" height="34" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="100" y="81" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">前端 Vue</text>
<rect x="168" y="64" width="104" height="34" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<text x="220" y="81" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Agent 服务</text>
<rect x="288" y="64" width="104" height="34" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="340" y="81" font-size="12" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">LLM Provider</text>
<rect x="408" y="64" width="104" height="34" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<text x="460" y="81" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">SQL 服务</text>
<rect x="528" y="64" width="104" height="34" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="580" y="81" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">适配器/目标库</text>

<line x1="100" y1="122" x2="214" y2="122" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="106" y="117" font-size="11" fill="#444441">提问（message · datasource_id）</text>

<path d="M220 150 L264 150 L264 166 L226 166" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="222" y="145" font-size="11" fill="#444441">落库用户消息 · 设标题</text>

<line x1="220" y1="182" x2="334" y2="182" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="226" y="177" font-size="11" fill="#444441">首次调用：system + 历史 + few-shot</text>

<line x1="340" y1="210" x2="226" y2="210" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="334" y="205" font-size="11" fill="#5F5E5A" text-anchor="end">JSON：thought / sql / answer</text>

<rect x="196" y="232" width="440" height="126" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
<rect x="196" y="232" width="176" height="18" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="206" y="241" font-size="11" fill="#444441" dominant-baseline="central">loop 工具调用（≤ 3 轮）</text>

<line x1="220" y1="256" x2="574" y2="256" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="226" y="251" font-size="11" fill="#444441">工具调用 list_tables / get_columns / sample_data / explain</text>

<line x1="580" y1="284" x2="226" y2="284" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="574" y="279" font-size="11" fill="#5F5E5A" text-anchor="end">表结构 / 采样数据 / 执行计划</text>

<line x1="220" y1="312" x2="334" y2="312" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="226" y="307" font-size="11" fill="#444441">追加工具结果，继续推理</text>

<line x1="340" y1="340" x2="226" y2="340" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="334" y="335" font-size="11" fill="#5F5E5A" text-anchor="end">最终 JSON</text>

<line x1="220" y1="384" x2="454" y2="384" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="226" y="379" font-size="11" fill="#444441">execute_sql：分类 → 鉴权 → 审计</text>

<line x1="460" y1="412" x2="574" y2="412" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="466" y="407" font-size="11" fill="#444441">执行 SQL（to_thread）</text>

<line x1="580" y1="440" x2="466" y2="440" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="574" y="435" font-size="11" fill="#5F5E5A" text-anchor="end">结果集</text>

<line x1="460" y1="468" x2="226" y2="468" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="454" y="463" font-size="11" fill="#5F5E5A" text-anchor="end">结果 + 审计留痕</text>

<line x1="220" y1="496" x2="334" y2="496" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="226" y="491" font-size="11" fill="#444441">结果总结（流式）</text>

<line x1="340" y1="524" x2="226" y2="524" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="334" y="519" font-size="11" fill="#5F5E5A" text-anchor="end">摘要 token 流</text>

<line x1="220" y1="552" x2="106" y2="552" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="106" y="547" font-size="11" fill="#444441">SSE 事件流：thought · sql · result · text · done</text>

<line x1="40" y1="584" x2="640" y2="584" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="44" y="578" font-size="11" fill="#5F5E5A">写操作分支（DML / DDL）· 生成待确认记录，确认后二次鉴权执行</text>

<line x1="220" y1="612" x2="106" y2="612" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="106" y="607" font-size="11" fill="#444441">authorization_required（execution_id + 风险等级）</text>

<line x1="100" y1="640" x2="214" y2="640" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="106" y="635" font-size="11" fill="#444441">POST /api/agent/confirm（确认执行）</text>

<line x1="220" y1="668" x2="454" y2="668" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="226" y="663" font-size="11" fill="#444441">confirm_execution：二次鉴权（TOCTOU 保护）</text>

<line x1="460" y1="696" x2="574" y2="696" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<text x="466" y="691" font-size="11" fill="#444441">执行 DML / DDL</text>

<text x="40" y="726" font-size="11" fill="#5F5E5A">实线 = 调用 · 虚线 = 返回 · 自上而下即一次问答的完整链路</text>
</svg>

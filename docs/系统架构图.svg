<svg viewBox="0 0 680 716" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<title>DataMind 系统架构图</title>
<desc>六层架构：客户端层、接入层、安全与权限层、服务层、适配层、数据层，箭头表示调用方向。</desc>
